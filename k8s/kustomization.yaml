apiVersion: kustomize.config.k8s.io/v1beta1
kind: Kustomization

# app-service.yaml is deliberately NOT listed here — see the comment at the
# top of that file for why (kubectl apply would otherwise clobber the live
# blue/green flip on every deploy).
resources:
  - storage.yaml
  - app-deployment-blue.yaml
  - app-deployment-green.yaml
  - postgres.yaml
  
secretGenerator:
  - name: whiskey-secrets
    envs:
      - .env
    options:
      disableNameSuffixHash: true

patches:
  - path: patches/nfs-server.yaml
