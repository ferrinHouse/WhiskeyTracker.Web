apiVersion: apps/v1
kind: Deployment
metadata:
  name: postgres
spec:
  replicas: 1
  strategy:
    # Default RollingUpdate briefly starts a second pod before the old one
    # terminates. With a single replica on a ReadWriteOnce PVC, that causes
    # the new pod to contend for the data directory lock with the old one
    # still mounted, crashing on startup until it self-recovers on retry.
    # Recreate avoids the overlap entirely for this single-replica workload.
    type: Recreate
  selector:
    matchLabels:
      app: postgres
  template:
    metadata:
      labels:
        app: postgres
    spec:
      containers:
        - name: postgres
          image: postgres:15-alpine
          # log_destination is postmaster-context: it can only be set at server
          # startup, not via PGOPTIONS (which is a per-connection parameter).
          # Use `args`, not `command` - overriding `command` replaces the
          # image's entrypoint (docker-entrypoint.sh), which is what drops
          # privileges to the postgres user; without it the server tries to
          # run as root and refuses to start.
          args: ["postgres", "-c", "log_destination=jsonlog"]
          ports:
            - containerPort: 5432
          livenessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - whiskey_prod
            initialDelaySeconds: 30
            periodSeconds: 10
          readinessProbe:
            exec:
              command:
                - pg_isready
                - -U
                - postgres
                - -d
                - whiskey_prod
            initialDelaySeconds: 15
            periodSeconds: 5
          resources:
            requests:
              memory: "256Mi"
              cpu: "250m"
            limits:
              memory: "512Mi"
              cpu: "500m"
          env:
          - name: POSTGRES_INITDB_ARGS
            value: "--auth-host=scram-sha-256"
          - name: PGOPTIONS
            value: "-c log_statement=ddl"
          - name: POSTGRES_DB
            value: whiskey_prod
          - name: POSTGRES_USER
            value: postgres
          - name: POSTGRES_PASSWORD
            valueFrom:
                secretKeyRef:
                  name: whiskey-secrets
                  key: db-password
          volumeMounts:
            - mountPath: /var/lib/postgresql/data
              name: db-storage
      volumes:
        - name: db-storage
          persistentVolumeClaim:
            claimName: whiskey-db-pvc
---
apiVersion: v1
kind: Service
metadata:
  name: postgres-service
spec:
  selector:
    app: postgres
  ports:

    - port: 5432


