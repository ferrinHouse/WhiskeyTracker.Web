apiVersion: apps/v1
kind: Deployment
metadata:
  name: whiskey-web
  labels:
    app: whiskey-tracker
spec:
  replicas: 1
  selector:
    matchLabels:
      app: whiskey-tracker
  template:
    metadata:
      labels:
        app: whiskey-tracker
    spec:
      # No node constraints: the image is multi-arch (amd64 + arm64), so the pod can run on any node.
      securityContext:
        fsGroup: 1654
      containers:
        - name: whiskey-web
          # CI overrides this tag with the commit SHA at deploy time (see .github/workflows/ci.yml).
          # "latest" is only used for manual applies.
          image: ghcr.io/ferrinhouse/whiskeytracker.web:latest
          ports:
            - containerPort: 8080
          # Database migrations run at startup, before the app listens, so allow time for them.
          startupProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 5
            failureThreshold: 36
          readinessProbe:
            httpGet:
              path: /health
              port: 8080
            periodSeconds: 10
            failureThreshold: 3
          livenessProbe:
            httpGet:
              path: /health
              port: 8080
            initialDelaySeconds: 15
            periodSeconds: 30
          env:
            - name: ASPNETCORE_ENVIRONMENT
              value: "Production"
            - name: Database__ConnectionString
              valueFrom:
                secretKeyRef:
                  name: whiskey-secrets
                  key: connection-string
            - name: ASPNETCORE_URLS
              value: "http://+:8080"
          envFrom:
            - secretRef:
                name: whiskey-secrets
          volumeMounts:
            - mountPath: /app/wwwroot/images
              name: photo-storage
      volumes:
        - name: photo-storage
          persistentVolumeClaim:
            claimName: whiskey-photos-pvc
