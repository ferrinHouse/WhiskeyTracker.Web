name: CI/CD Pipeline

on:
  push:
    branches: [ "main" ]
  pull_request:
    branches: [ "main" ]

jobs:
  # 1. RUN TESTS
  test:
    runs-on: ubuntu-latest
    services:
      postgres:
        image: postgres:15-alpine
        env:
          POSTGRES_PASSWORD: whiskeypass
          POSTGRES_DB: whiskey_test_db
        ports:
          - 5432:5432
        options: >-
          --health-cmd pg_isready
          --health-interval 10s
          --health-timeout 5s
          --health-retries 5

    steps:
    - uses: actions/checkout@v7
    - name: Setup .NET
      uses: actions/setup-dotnet@v6
      with:
        dotnet-version: 10.0.x

    - name: Test
      run: dotnet test
      env:
        Database__Provider: Postgres
        Database__ConnectionString: "Host=localhost;Database=whiskey_test_db;Username=postgres;Password=whiskeypass"
        Database__SeedOnStartup: true

  # 2. BUILD MULTI-ARCH CONTAINER IMAGE (pushed to GHCR on main; build-only on PRs)
  build-image:
    runs-on: ubuntu-latest
    needs: [test]
    permissions:
      contents: read
      packages: write
    steps:
    - name: Checkout repository
      uses: actions/checkout@v7

    - name: Set up Docker Buildx
      uses: docker/setup-buildx-action@v4

    - name: Log in to GHCR
      if: github.event_name == 'push'
      uses: docker/login-action@v4
      with:
        registry: ghcr.io
        username: ${{ github.actor }}
        password: ${{ secrets.GITHUB_TOKEN }}

    - name: Image metadata
      id: meta
      uses: docker/metadata-action@v6
      with:
        images: ghcr.io/${{ github.repository }}
        tags: |
          type=sha,format=long
          type=raw,value=latest,enable={{is_default_branch}}

    - name: Build and push
      uses: docker/build-push-action@v7
      with:
        context: .
        platforms: linux/amd64,linux/arm64
        push: ${{ github.event_name == 'push' }}
        tags: ${{ steps.meta.outputs.tags }}
        labels: ${{ steps.meta.outputs.labels }}
        cache-from: type=gha
        cache-to: type=gha,mode=max

  # 3. DEPLOY TO PI CLUSTER
  deploy:
    runs-on: self-hosted
    needs: [test, build-image]
    if: github.ref == 'refs/heads/main'
    # Never let two deploys overlap (they share the db-backup pod and the rollout).
    concurrency:
      group: deploy
      cancel-in-progress: false
    steps:
    # Pinned to v4 (unlike the other jobs above): v5+ needs the self-hosted
    # runner on Actions Runner >= 2.327.1, which hasn't been confirmed yet.
    - name: Checkout repository
      uses: actions/checkout@v4

    - name: Inject Secrets
      run: |
        echo "${{ secrets.SECRETS_ENV_FILE }}" > k8s/.env

    - name: Check for Pending Migrations
      id: check_migrations
      run: |
        # Get latest from DB
        DB_MIGRATION=$(kubectl exec deployment/postgres -- psql -U postgres -d whiskey_prod -t -c 'SELECT "MigrationId" FROM "__EFMigrationsHistory" ORDER BY "MigrationId" DESC LIMIT 1;' | xargs)

        # Get latest from code (ignore the generated .Designer.cs companions)
        LOCAL_MIGRATION=$(find WhiskeyTracker.Web/Migrations -name "[0-9]*.cs" ! -name "*.Designer.cs" | sort | tail -n 1 | xargs basename -s .cs)

        echo "Database latest: $DB_MIGRATION"
        echo "Local code latest: $LOCAL_MIGRATION"

        if [ "$DB_MIGRATION" != "$LOCAL_MIGRATION" ]; then
          echo "HAS_NEW_MIGRATIONS=true" >> $GITHUB_OUTPUT
          echo "New migration detected: $LOCAL_MIGRATION"
        else
          echo "HAS_NEW_MIGRATIONS=false" >> $GITHUB_OUTPUT
          echo "No new migrations found."
        fi
      continue-on-error: true

    # The app runs migrations on startup, so back the database up BEFORE rolling out the new image.
    # The dump goes to /app/backups on the app NFS volume, which is now used only for backups.
    - name: Backup Database
      if: steps.check_migrations.outputs.HAS_NEW_MIGRATIONS == 'true'
      run: |
        set -o pipefail
        cat <<EOF | kubectl apply -f -
        apiVersion: v1
        kind: Pod
        metadata:
          name: db-backup
        spec:
          containers:
          - name: backup
            image: debian:stable-slim
            command: ["sleep", "600"]
            volumeMounts:
            - mountPath: /app
              name: app-storage
          volumes:
          - name: app-storage
            persistentVolumeClaim:
              claimName: whiskey-app-pvc
        EOF
        kubectl wait --for=condition=Ready pod/db-backup --timeout=60s

        TIMESTAMP=$(date +%Y%m%d_%H%M%S)
        echo "Streaming backup from DB pod to App PVC (/app/backups)..."
        kubectl exec db-backup -- mkdir -p /app/backups
        kubectl exec deployment/postgres -- pg_dump -U postgres whiskey_prod | \
          kubectl exec -i db-backup -- sh -c "cat > /app/backups/whiskey_prod_$TIMESTAMP.sql"
        # Keep last 7 days of backups on PVC
        kubectl exec db-backup -- find /app/backups -name "*.sql" -mtime +7 -delete
      continue-on-error: true

    - name: Cleanup Backup Pod
      if: always()
      run: kubectl delete pod db-backup --ignore-not-found

    - name: Set Image Tag
      run: |
        cat >> k8s/kustomization.yaml <<EOF

        images:
          - name: ghcr.io/ferrinhouse/whiskeytracker.web
            newTag: sha-${{ github.sha }}
        EOF

    - name: Apply Manifests
      run: kubectl apply -k k8s/

    - name: Wait for Rollout
      run: kubectl rollout status deployment/whiskey-web --timeout=300s

    - name: Show Pod State on Failure
      if: failure()
      run: |
        kubectl get pods -o wide
        kubectl describe pods -l app=whiskey-tracker | tail -40
        kubectl logs -l app=whiskey-tracker --tail=100 --prefix || true
